<!DOCTYPE html> <!--The doctype statement indicates the markup language of the document-->
<html lang="en">
<head> <!--The head element provides information and instructions to the browser about the document.-->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Coding Conf 2026</title> <!--The contents of the title element appear in the browser title bar.-->
  <link rel="icon" type="image/png" href="assets/images/favicon-32x32.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;700;800&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ========== HEADER: logo and navigation ========== -->
  <header class="site-header">
    <a href="index.html" class="logo-link">
      <img src="assets/images/logo-full.svg" alt="Coding Conf home" class="logo" />
    </a>
    <nav aria-label="Main">
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html" aria-current="page">Register</a></li>
      </ul>
    </nav>
  </header>

  <!-- ========== MAIN CONTENT ========== -->
  <main>

    <!-- Page heading -->
    <section class="intro" aria-labelledby="form-heading">
      <h1 id="form-heading">Your Journey to Coding Conf 2026 Starts Here!</h1>
      <p>Secure your spot at this year's biggest coding conference.</p>
    </section>

    <!-- Registration form: novalidate turns off the browser's own checks so validation.js does them -->
    <section class="form-section" aria-label="Registration form">
      <form name="regForm" id="regForm" action="#" novalidate>

        <!-- Avatar upload -->
        <div class="field">
          <label for="avatar">Upload Avatar</label>
          <div class="upload-box">
            <img src="assets/images/icon-upload.svg" alt="" class="upload-icon" />
            <p>Drag and drop or click to upload</p>
            <input type="file" id="avatar" name="avatar" accept="image/jpeg, image/png"
                   aria-describedby="avatarHint avatarError" />
          </div>
          <p class="hint" id="avatarHint">
            <img src="assets/images/icon-info.svg" alt="" class="hint-icon" />
            Upload your photo (JPG or PNG, max size: 500KB).
          </p>
          <p class="error" id="avatarError" aria-live="polite"></p>
        </div>

        <!-- Full name -->
        <div class="field">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" autocomplete="name"
                 aria-describedby="fullNameError" />
          <p class="error" id="fullNameError" aria-live="polite"></p>
        </div>

        <!-- Email address -->
        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="example@email.com" autocomplete="email"
                 aria-describedby="emailError" />
          <p class="error" id="emailError" aria-live="polite"></p>
        </div>

        <!-- GitHub username -->
        <div class="field">
          <label for="github">GitHub Username</label>
          <input type="text" id="github" name="github" placeholder="@yourusername"
                 aria-describedby="githubError" />
          <p class="error" id="githubError" aria-live="polite"></p>
        </div>

        <button type="submit" class="btn btn-full">Generate My Ticket</button>

      </form>
    </section>

  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="site-footer">
    <p>&copy; 2026 Coding Conf. Papine, Kingston, Jamaica.</p>
  </footer>

  <!-- Decorative background patterns: empty alt so screen readers skip them -->
  <img src="assets/images/pattern-squiggly-line-top.svg" alt="" class="decor decor-top" />
  <img src="assets/images/pattern-squiggly-line-bottom-desktop.svg" alt="" class="decor decor-bottom" />
  <img src="assets/images/pattern-circle.svg" alt="" class="decor decor-circle" />

  <!-- JavaScript goes last so the form above already exists when it runs -->
  <script type="text/javascript" src="js/validation.js"></script>

</body>
</html>
