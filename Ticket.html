<!DOCTYPE html> <!--The doctype statement indicates the markup language of the document-->
<html lang="en">
<head> <!--The head element provides information and instructions to the browser about the document.-->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Ticket | Coding Conf 2026</title> <!--The contents of the title element appear in the browser title bar.-->
  <link rel="icon" type="image/png" href="assets/images/favicon-32x32.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;700;800&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ========== HEADER: logo and navigation ========== -->
  <header class="site-header">
    <a href="index.html" class="logo-link">
      <img src="assets/images/logo-full.svg" alt="Coding Conf home" class="logo" />
    </a>
    <nav aria-label="Main">
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html">Register</a></li>
      </ul>
    </nav>
  </header>

  <!-- ========== MAIN CONTENT ========== -->
  <main>

    <!-- Success message: ticket.js fills in the empty spans -->
    <section class="confirmation" aria-labelledby="congrats-heading">
      <h1 id="congrats-heading">
        Congrats, <span class="gradient-text" id="congratsName"></span>!
        Your ticket is ready.
      </h1>
      <p>
        We've emailed your ticket to <span class="highlight" id="congratsEmail"></span>
        and will send updates in the run up to the event.
      </p>
    </section>

    <!-- The glass ticket: ticket.js fills in the empty elements -->
    <section class="ticket-section" aria-label="Your conference ticket">
      <article class="ticket">

        <!-- Event details -->
        <div class="ticket-event">
          <img src="assets/images/logo-mark.svg" alt="" class="ticket-logo" />
          <div>
            <h2 class="ticket-title">Coding Conf</h2>
            <p class="ticket-meta">
              <time datetime="2026-10-26">Oct 26, 2026</time> / Papine, Kgn
            </p>
          </div>
        </div>

        <!-- Attendee details -->
        <div class="ticket-attendee">
          <img src="assets/images/image-avatar.jpg" alt="Attendee photo" class="ticket-avatar" id="ticketAvatar" />
          <div>
            <p class="ticket-name" id="ticketName"></p>
            <p class="ticket-github">
              <img src="assets/images/icon-github.svg" alt="GitHub" class="github-icon" />
              <a href="#" id="ticketGithub" target="_blank"></a>
            </p>
          </div>
        </div>

        <!-- Ticket number (the stub on the right) -->
        <p class="ticket-number" id="ticketNumber"></p>

      </article>
    </section>

  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="site-footer">
    <p>&copy; 2026 Coding Conf. Papine, Kingston, Jamaica.</p>
  </footer>

  <!-- Decorative background patterns: empty alt so screen readers skip them -->
  <img src="assets/images/pattern-squiggly-line-top.svg" alt="" class="decor decor-top" />
  <img src="assets/images/pattern-squiggly-line-bottom-desktop.svg" alt="" class="decor decor-bottom" />
  <img src="assets/images/pattern-circle.svg" alt="" class="decor decor-circle" />

  <!-- JavaScript goes last so the elements above already exist when it runs -->
  <script type="text/javascript" src="js/ticket.js"></script>

</body>
</html>
